/* ---------- Connexion sans compte (PeerJS) : le téléphone de l'animateur relaie la partie ---------- */
const STANDALONE=typeof Peer!=='undefined';
function peerConnect(code){
  const hostId='quizcamemberts-'+code.toLowerCase();
  let selfKey=null,isServer=false,conns=[],toServer=null,peerObj=null,mineP={},list={};
  const peersL=[],connL=[];
  const snapshot=()=>Object.entries(list).map(([k,pr])=>({peer:k,sameTab:k===selfKey,isMe:k===selfKey,presence:pr,updatedAt:Date.now(),kind:'viewer',guest:false,by:null}));
  const emitPeers=()=>{const arr=snapshot();peersL.forEach(f=>f({peers:arr,joined:[],left:[],updated:[]}))};
  const setConn=v=>connL.forEach(f=>f(v));
  const broadcast=()=>{conns.forEach(c=>{try{c.open&&c.send({t:'all',list})}catch(e){}});emitPeers()};
  const shim={
    get isServer(){return isServer},
    presence(patch){for(const[k,v]of Object.entries(patch)){if(v===null)delete mineP[k];else mineP[k]=v}
      if(isServer){list[selfKey]=mineP;broadcast()}else if(toServer&&toServer.open){toServer.send({t:'me',pr:mineP})}
      return Promise.resolve()},
    onPeers(f){peersL.push(f);setTimeout(()=>f({peers:snapshot(),joined:[],left:[],updated:[]}));return()=>{}},
    onConnection(f){connL.push(f);setTimeout(()=>f(true));return()=>{}},
    leave(){try{peerObj&&peerObj.destroy()}catch(e){}}
  };
  return new Promise(resolve=>{
    let done=false;const finish=v=>{if(!done){done=true;resolve(v)}};
    setTimeout(()=>finish(null),12000);
    const p=new Peer(hostId,{debug:0});peerObj=p;
    p.on('open',()=>{ // l'identifiant de la partie était libre : je suis le premier, j'anime
      isServer=true;selfKey='animateur';
      p.on('connection',c=>{
        c.on('open',()=>{conns.push(c);c.send({t:'all',list})});
        c.on('data',d=>{if(d&&d.t==='me'&&d.pr&&typeof d.pr==='object'){list[c.peer]=d.pr;broadcast()}});
        c.on('close',()=>{delete list[c.peer];conns=conns.filter(x=>x!==c);broadcast()});
      });
      finish(shim);
    });
    p.on('error',err=>{
      if(err.type!=='unavailable-id'||isServer){if(!isServer)finish(null);return}
      // la partie existe déjà : je la rejoins comme joueur
      try{p.destroy()}catch(e){}
      const q=new Peer({debug:0});peerObj=q;
      q.on('open',myId=>{
        selfKey=myId;toServer=q.connect(hostId,{reliable:true});
        toServer.on('open',()=>{toServer.send({t:'me',pr:mineP});finish(shim)});
        toServer.on('data',d=>{if(d&&d.t==='all'&&d.list){list=d.list;emitPeers()}});
        toServer.on('close',()=>{list={};emitPeers();setConn(false)});
      });
      q.on('error',()=>finish(null));
    });
  });
}

/* ---------- Outils ---------- */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffled(arr,seedStr){const r=rng(hash(seedStr));const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function randomCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function store(k,v){try{if(v===undefined)return JSON.parse(sessionStorage.getItem(k));sessionStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}

/* ---------- Synchronisation ---------- */
function pushPresence(){
  if(!room||!me.code)return;
  room.presence({code:me.code,name:me.name,role:me.role,score:mine?mine.score:0,good:mine?mine.good:0,
    owned:mine?Object.keys(mine.owned):[],ans:mine&&mine.ans?mine.ans:null,game:me.role==='host'?game:null}).catch(()=>{});
}
function others(){return peers.filter(p=>!p.sameTab&&p.presence&&p.presence.code===me.code&&p.presence.name)}
function hostPeer(){const h=others().filter(p=>p.presence.role==='host'&&p.presence.game);
  h.sort((a,b)=>(a.presence.game.created||0)-(b.presence.game.created||0));return h[0]||null}
function currentGame(){return me.role==='host'?game:(hostPeer()?.presence.game||null)}
function roster(){
  const list=others().filter(p=>p.presence.role).map(p=>({id:p.peer,name:p.presence.name,score:+p.presence.score||0,good:+p.presence.good||0,
    host:p.presence.role==='host',ans:p.presence.ans,me:false}));
  list.push({id:'me',name:me.name,score:mine?mine.score:0,good:mine?mine.good:0,host:me.role==='host',ans:mine?mine.ans:null,me:true});
  return list;
}

/* ---------- Animateur ---------- */
function hostNewGame(level,total){
  game={created:Date.now(),level,total,seq:0,phase:'lobby',theme:null,lvl:null,qi:null,used:[]};
}
function hostNextQuestion(){
  const pool=[];
  for(const t of THEMES)for(const l of [+game.level])
    Q[t.id][l].forEach((_,i)=>{const k=t.id+l+'_'+i;if(!game.used.includes(k))pool.push({t:t.id,l,i,k})});
  if(!pool.length||game.seq>=game.total){game.phase='end';sync();return}
  const th=pick([...new Set(pool.map(p=>p.t))]);            // thème tiré au hasard
  const q=pick(pool.filter(p=>p.t===th));
  game.used.push(q.k);
  Object.assign(game,{seq:game.seq+1,phase:'question',theme:q.t,lvl:q.l,qi:q.i,startedAt:Date.now()});
  sync();
}
function hostReveal(){if(game&&game.phase==='question'){game.phase='reveal';game.revealedAt=Date.now();sync()}}
function hostTick(){
  if(me.role!=='host'||!game)return;
  if(game.phase==='question'){
    const players=roster();
    const all=players.every(p=>p.ans&&p.ans.seq===game.seq);
    if(Date.now()-game.startedAt>=DUR||all)hostReveal();
  } else if(game.phase==='reveal'&&Date.now()-game.revealedAt>=REVEAL_AUTO){hostNextQuestion()}
}
function sync(){store('qc-game-'+me.code,game);pushPresence();render()}

/* ---------- Joueur ---------- */
function questionOf(g){
  const q=Q[g.theme][g.lvl][g.qi];
  return{text:q[0],good:q[1],opts:shuffled(q.slice(1,5),me.code+'|'+g.seq+'|'+g.theme+g.lvl+g.qi),src:q[5],note:q[6]||''};
}
function answer(i){
  const g=currentGame();if(!g||g.phase!=='question')return;
  if(mine.ans&&mine.ans.seq===g.seq)return;
  const q=questionOf(g);const ok=q.opts[i]===q.good;
  mine.ans={seq:g.seq,i,ok};
  if(ok&&!mine.scored[g.seq]){mine.scored[g.seq]=1;mine.score+=LEVELS[g.lvl].pts;mine.good++;mine.owned[g.theme]=1}
  saveMine();pushPresence();render();
}

function wheel(cls=''){
  let p='';
  THEMES.forEach((t,i)=>{
    const st=360/N,a0=(-90+i*st)*Math.PI/180,a1=(-90+(i+1)*st)*Math.PI/180,r=46;
    const x0=50+r*Math.cos(a0),y0=50+r*Math.sin(a0),x1=50+r*Math.cos(a1),y1=50+r*Math.sin(a1);
    const own=mine&&mine.owned[t.id];
    p+=`<path d="M50 50L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 0 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${own?`var(--${t.id})`:'var(--track)'}" stroke="var(--bg)" stroke-width="2.5" stroke-linejoin="round"/>`;
  });
  const n=mine?Object.keys(mine.owned).length:0;
  return `<svg class="wheel ${cls}" viewBox="0 0 100 100" role="img" aria-label="${n} camemberts sur ${N}"><circle cx="50" cy="50" r="48.5" fill="var(--surface)"/>${p}<circle cx="50" cy="50" r="7" fill="var(--surface)" stroke="var(--bg)" stroke-width="2"/></svg>`;
}

function playerList(g,mode){
  const list=roster().sort((a,b)=>mode==='lobby'?0:b.score-a.score);
  return `<ul class="players">${list.map((p,k)=>{
    let mark='';
    if(mode==='q'){const done=p.ans&&p.ans.seq===g.seq;mark=`<span class="mark ${done?'ok':''}">${done?'✓':''}</span>`}
    if(mode==='r'){const a=p.ans&&p.ans.seq===g.seq?p.ans:null;mark=`<span class="mark ${a?(a.ok?'ok':'ko'):''}">${a?(a.ok?'✓':'✗'):'–'}</span>`}
    return `<li class="${p.me?'me':''}">${mode==='lobby'?'':`<span class="rk">${k+1}</span>`}<span class="nm">${esc(p.name)}${p.me?' <span class="tag">toi</span>':''}${p.host?' <span class="tag">animateur</span>':''}</span>${mode==='lobby'?'':`<span class="pt">${p.score}</span>`}${mark}</li>`}).join('')}</ul>`;
}

function viewQuestion(g){
  const q=questionOf(g),th=THEMES.find(t=>t.id===g.theme);
  const my=mine.ans&&mine.ans.seq===g.seq?mine.ans:null;
  const reveal=g.phase==='reveal';
  const answers=q.opts.map((o,i)=>{
    let cls='';if(reveal){if(o===q.good)cls='good';else if(my&&my.i===i)cls='bad'}else if(my&&my.i===i)cls='pick';
    return `<button class="ans ${cls}" data-i="${i}" ${my||reveal?'disabled':''}><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`}).join('');
  let after='';
  if(reveal){
    const href=/^https?:/.test(q.src)?q.src:'https://fr.wikipedia.org/w/index.php?title=Sp%C3%A9cial:Recherche&go=Consulter&search='+encodeURIComponent(q.src);
    const lab=/^https?:/.test(q.src)?new URL(q.src).hostname.replace(/^www\./,''):'Wikipédia : '+q.src;
    const ok=my&&my.ok;
    after=`<div class="verdict ${ok?'ok':'ko'}">${ok?`Bonne réponse ! +${LEVELS[g.lvl].pts} pt${g.lvl>1?'s':''}`:(my?'Raté':'Pas de réponse')}
      ${ok?'':`<span>La réponse était : ${esc(q.good)}.</span>`}${q.note?`<span>${esc(q.note)}</span>`:''}
      <span class="src">Source : <a href="${esc(href)}" target="_blank" rel="noopener">${esc(lab)}</a></span></div>
      ${me.role==='host'?`<button class="btn" data-act="next">${g.seq>=g.total?'Voir le classement':'Question suivante'}</button><small class="muted center">Passage automatique au bout de 12 s.</small>`:'<p class="wait">L\'animateur va passer à la question suivante.</p>'}
      <section class="panel"><h3>Classement</h3>${playerList(g,'r')}</section>`;
  } else {
    after=my?`<p class="wait">Réponse enregistrée. On attend les autres…</p>`:'';
    after+=`<section class="panel"><h3>Ont répondu</h3>${playerList(g,'q')}</section>`;
  }
  return `<div class="topbar"><div><div class="label">Question ${g.seq} / ${g.total}</div><div class="score">${mine.score} pts</div></div>${wheel('').replace('class="wheel ','class="wheel" style="width:64px;height:64px" data-x="')}</div>
  <div class="qhead" style="--c:var(--${g.theme})"><span class="chip">${th.name}</span><span class="chip plain">${LEVELS[g.lvl].name} · ${LEVELS[g.lvl].pts} pt${g.lvl>1?'s':''}</span></div>
  ${reveal?'':`<div class="timer" style="--c:var(--${g.theme})"><i id="bar"></i></div>`}
  <p class="qtext">${esc(q.text)}</p>
  <div class="answers">${answers}</div>${after}`;
}
function viewEnd(g){
  const list=roster().sort((a,b)=>b.score-a.score);
  const rank=list.findIndex(p=>p.me)+1;
  return `<header class="hero">${wheel('big')}<h1>${rank===1?'Victoire !':'Partie terminée'}</h1>
    <p class="podium">${rank}${rank===1?'er':'e'} sur ${list.length} · ${mine.score} pts</p></header>
  <section class="panel"><h3>Classement final</h3>${playerList(g,'end')}</section>
  ${me.role==='host'?'<button class="btn" data-act="again">Nouvelle partie avec les mêmes joueurs</button>':'<p class="wait">L\'animateur peut relancer une partie.</p>'}
  <button class="link" data-act="leave">Quitter</button>`;
}

function render(){
  let html;
  if(!me.role)html=viewHome();
  else{
    // deux animateurs entrés en même temps : le plus ancien garde la main
    const hp=hostPeer();if(me.role==='host'&&game&&game.phase==='lobby'&&hp&&hp.presence.game.created<game.created){me.role='player';game=null;pushPresence()}
    const g=currentGame();
    if(g&&me.role==='player'&&mine.gameId!==g.created){mine=freshMine();mine.gameId=g.created;saveMine();pushPresence()}
    if(!g||g.phase==='lobby')html=viewLobby();
    else if(g.phase==='end')html=viewEnd(g);
    else html=viewQuestion(g);
  }
  if(html===lastHtml)return;
  const typing=document.activeElement&&document.activeElement.tagName==='INPUT';
  if(typing&&!me.role)return; // ne pas effacer la saisie de l'accueil
  const scroll=html.slice(0,80)!==lastHtml.slice(0,80);
  lastHtml=html;app.innerHTML=html;tick();
  if(scroll&&me.role)window.scrollTo(0,0);
}
function tick(){
  hostTick();
  const g=currentGame(),bar=document.getElementById('bar');
  if(g&&g.phase==='question'){
    if(!seen[g.seq])seen[g.seq]=me.role==='host'?g.startedAt:Date.now();
    if(bar)bar.style.setProperty('--k',Math.max(0,1-(Date.now()-seen[g.seq])/DUR));
  }
}
setInterval(()=>{tick();if(me.role==='player')render()},250);

app.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.i!==undefined){answer(+b.dataset.i);return}
  if(b.dataset.lv){game.level=b.dataset.lv;sync();return}
  if(b.dataset.tot){game.total=+b.dataset.tot;sync();return}
  const act=b.dataset.act;
  if(act==='enter'){
    me.name=(document.getElementById('name').value.trim()||'Joueur').slice(0,18);
    me.code=(document.getElementById('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'')||randomCode());
    store('qc-name',me.name);store('qc-lastcode',me.code);
    b.disabled=true;b.textContent='Connexion…';
    if(STANDALONE){
      room=await peerConnect(me.code);
      if(!room){b.disabled=false;b.textContent='Entrer dans la partie';connErr=true;lastHtml='';render();return}
      connErr=false;online=true;room.onPeers(ch=>{peers=ch.peers;render()});room.onConnection(c=>{online=c;lastHtml='';render()});
      me.role=room.isServer?'host':'player';
    } else {
    for(let k=0;k<12&&room&&(!online||!peers.length);k++)await new Promise(r=>setTimeout(r,250));
    if(room&&online)await new Promise(r=>setTimeout(r,600)); // laisse arriver les autres joueurs
    me.role=hostPeer()?'player':'host';
    }
    mine=store('qc-mine-'+me.code)||freshMine();
    if(me.role==='host'){game=store('qc-game-'+me.code);if(!game||game.phase==='end'){hostNewGame('1',10);mine=freshMine()}}
    lastHtml='';sync();return;
  }
  if(act==='start'){mine=freshMine();mine.gameId=game.created;saveMine();hostNextQuestion();return}
  if(act==='next'){hostNextQuestion();return}
  if(act==='again'){const lv=game.level,tot=game.total;hostNewGame(lv,tot);mine=freshMine();mine.gameId=game.created;saveMine();sync();return}
  if(act==='leave'){me.role=null;game=null;if(STANDALONE){room&&room.leave();room=null;online=false;peers=[]}else room&&room.presence({code:null,role:null,game:null,ans:null}).catch(()=>{});lastHtml='';render();return}
});

render();
(async()=>{
  try{room=await window.claude?.use?.('room')}catch(e){room=null}
  if(!room)return;
  room.onConnection(c=>{online=c;lastHtml='';render()},()=>{online=false;room=null;lastHtml='';render()});
  room.onPeers(ch=>{peers=ch.peers;render()});
  pushPresence();
})();
</script>
